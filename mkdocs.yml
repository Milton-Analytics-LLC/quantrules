site_name: quantrules
site_description: Composable building blocks for systematic trading systems.
site_url: https://Milton-Analytics-LLC.github.io/quantrules/
repo_url: https://github.com/Milton-Analytics-LLC/quantrules
repo_name: Milton-Analytics-LLC/quantrules
copyright: Copyright 2026 Milton Analytics, LLC. Licensed under Apache-2.0.

# Internal design specs live in the repository but are not published documentation.
exclude_docs: |
  superpowers/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Concepts:
      - Overview: concepts/index.md
      - The data contract: concepts/data-contract.md
      - No look-ahead: concepts/causality.md
  - API reference:
      - defaults: api/defaults.md
      - config: api/config.md
      - exceptions: api/exceptions.md
      - testing: api/testing.md
