[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quantrules"
dynamic = ["version"]
description = "Composable, data-provider-agnostic building blocks for systematic trading systems."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Milton Analytics, LLC" }]
maintainers = [{ name = "Milton Analytics, LLC" }]
keywords = [
    "systematic-trading",
    "quantitative-finance",
    "trading-rules",
    "forecasts",
    "volatility-targeting",
    "portfolio-construction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
options = ["scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/Milton-Analytics-LLC/quantrules"
Documentation = "https://Milton-Analytics-LLC.github.io/quantrules/"
Repository = "https://github.com/Milton-Analytics-LLC/quantrules"
Changelog = "https://github.com/Milton-Analytics-LLC/quantrules/blob/main/CHANGELOG.md"
Issues = "https://github.com/Milton-Analytics-LLC/quantrules/issues"

[dependency-groups]
test = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]
lint = ["ruff==0.16.8"]
typecheck = [
    "mypy>=1.11",
    "pandas-stubs>=2.2; python_version >= '3.11'",
]
# MkDocs 2.0 removes the plugin system with no migration path, so the major version
# is pinned deliberately rather than left to float.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "docs" },
    "pre-commit>=3.7",
]

[tool.hatch.version]
path = "src/quantrules/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quantrules"]

[tool.hatch.build.targets.sdist]
include = ["src/quantrules", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "NPY",  # numpy-specific
    "PD",   # pandas-vet
    "PL",   # pylint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D206",   # conflicts with the formatter
    "W191",   # conflicts with the formatter
    "PLR0913", # numerical APIs legitimately take several parameters
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Test names document the behaviour; docstrings are added only where a "why" needs
# saying, and magic numbers in assertions are the point of the assertion.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "PLR2004"]
"docs/**" = ["D"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
strict = true
warn_unreachable = true
# No `python_version` pin: numpy's bundled stubs use PEP 695 `type` statements, which
# mypy can only parse when targeting 3.12+. Compatibility with the lowest supported
# Python is proven by the CI matrix actually running the suite on 3.10, and by ruff's
# `target-version = "py310"`.
files = ["src", "tests"]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=quantrules",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["quantrules"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
